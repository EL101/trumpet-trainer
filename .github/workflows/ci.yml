name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run tests
        working-directory: client
        run: npm test -- --run

  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires it, even for the `prisma generate` run by npm ci.
      DATABASE_URL: postgresql://trumpet:trumpet@localhost:5433/trumpet_trainer_test
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16.8
        env:
          POSTGRES_USER: trumpet
          POSTGRES_PASSWORD: trumpet
          POSTGRES_DB: trumpet_trainer
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trumpet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: npm test -- --run
